; Third Person Crosshair
; Replaces the dot you get when aiming a gun in third person with a real
; crosshair. Standalone: works with the vanilla HUD and with FallUI - HUD.

[General]
; Log camera / weapon state changes and the vanilla crosshair's layout to
; Documents\My Games\Fallout4\F4SE\ThirdPersonCrosshair.log
Debug=0

; aiming = only while aiming in third person (where vanilla shows the dot)
; drawn  = any time a weapon is out in third person
ShowWhen=aiming

; vanilla = turn the game's own four crosshair lines back on (the ones you
;           see when firing from the hip). Same look, colour and spread.
; custom  = draw our own crosshair from the [Crosshair] section.
Style=vanilla

; custom only: fade out the vanilla crosshair while ours is showing.
HideVanilla=1

; custom only: fade only this child of the vanilla crosshair instead of
; all of it. Leave empty to fade the whole thing.
HideChild=

; Stay hidden whenever the game hides its own crosshair (crosshair turned
; off in Settings > Display, Survival difficulty, and so on). Set to 0 to
; always show while aiming.
FollowVanillaVisibility=1

; Where the vanilla crosshair lives in HUDMenu, tried in order. If none
; match, the plugin searches the HUD for the last name of each path.
CrosshairPath=root.CenterGroup_mc.HUDCrosshair_mc, root.HUDCrosshair_mc

[Crosshair]
; CenterDot applies to both styles: with Style=vanilla, 0 hides the
; game's aiming dot and leaves only the four lines.
; Everything else here is for Style=custom. Sizes are in HUD pixels.
; Length of each of the four lines. 0 = dot only.
Length=10
; Space between the centre and where each line starts.
Gap=5
Thickness=2
CenterDot=1
DotSize=2

; Nudge the crosshair if it is not centred on where you shoot.
OffsetX=0
OffsetY=0

; HUD = follow the HUD colour like the vanilla crosshair.
; Or an RGB value, e.g. 0xFFFFFF for white, 0x00FF00 for green.
Color=HUD
Alpha=1.0

; A dark border so the crosshair reads on bright backgrounds. 0 = none.
Outline=1
OutlineColor=0x000000
OutlineAlpha=0.6
